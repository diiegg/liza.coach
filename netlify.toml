# Netlify configuration for liza.coach
# =====================================

[build]
  command = "pnpm run build"
  publish = ".next"

# Next.js plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security Headers
# ================
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS - Force HTTPS for 1 year, include subdomains, and allow preload list inclusion
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Prevent clickjacking attacks
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Legacy XSS protection for older browsers
    X-XSS-Protection = "1; mode=block"
    
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Upgrade HTTP requests to HTTPS
    Content-Security-Policy = "upgrade-insecure-requests"

# Redirect Rules
# ==============

# HTTP to HTTPS redirect for liza.coach
[[redirects]]
  from = "http://liza.coach/*"
  to = "https://liza.coach/:splat"
  status = 301
  force = true

# HTTP to HTTPS redirect for www.liza.coach
[[redirects]]
  from = "http://www.liza.coach/*"
  to = "https://liza.coach/:splat"
  status = 301
  force = true

# www to non-www redirect (HTTPS)
[[redirects]]
  from = "https://www.liza.coach/*"
  to = "https://liza.coach/:splat"
  status = 301
  force = true
